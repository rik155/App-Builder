<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/studio.css"><title>{{ app_name }}</title></head><body class="builder-shell"><div class="studio-layout"><aside class="chat-panel"><div class="chat-head"><div class="mark smallmark">A</div><div><strong>V13 Product Studio</strong><small>{{ app_name }}</small></div><div class="mini-status online">{{ elapsed }}s</div></div><div class="qa-strip"><span>QA</span><strong class="good">{{ qa.score }}/100</strong></div><div class="chat-scroll"><div class="msg assistant"><div class="bubble">Gebouwd vanuit jouw goedgekeurde productplan. Voeg hieronder extra modules toe.</div></div></div><div class="quick-prompts"><button onclick="fill('GPS tracking')">+ GPS</button><button onclick="fill('Facturatie')">+ Facturatie</button><button onclick="fill('Foto upload')">+ Foto's</button></div><form class="chat-form" action="/studio/{{ sid }}/module" method="post"><input id="module" name="module" required placeholder="Nieuwe module..."><button class="send">Toevoegen</button></form></aside><section class="preview-panel"><div class="preview-head"><div><strong>{{ app_name }}</strong><small>Live preview - versie {{ version }}</small></div><div class="preview-actions"><a href="/apps/{{ slug }}" target="_blank">Open apart</a><a class="download-link" href="/download/{{ slug }}">ZIP</a></div></div><div class="devicebar"><button class="active" data-w="100%">Desktop</button><button data-w="820px">Tablet</button><button data-w="390px">iPhone</button></div><div class="preview-canvas"><iframe id="frame" src="/apps/{{ slug }}?v={{ version }}"></iframe></div></section></div><script>const frame=document.getElementById("frame");function fill(x){module.value=x}document.querySelectorAll(".devicebar button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".devicebar button").forEach(x=>x.classList.remove("active"));b.classList.add("active");frame.style.width=b.dataset.w});</script></body></html>
