<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/static/app.css"><title>Smart App Builder V3</title></head><body>
<header><div class="logo">AI</div><div><strong>Smart App Builder</strong><small>Niet alleen formulieren meer</small></div></header>
<main><section class="hero"><span>V3 SMART</span><h1>Wat wil je maken?</h1><p>Beschrijf het gewoon. De builder kiest nu zelf een passend soort app.</p></section>
<form action="/build" method="post"><div class="card">
<label>Naam<input name="app_name" required placeholder="Bijv. Reactiespel"></label>
<label>Prompt<textarea name="prompt" rows="8" required placeholder="Bijv. Maak een donker reactiespel voor iPhone. Na een willekeurige tijd moet ik zo snel mogelijk klikken."></textarea></label>
<div class="chips"><span>Werkbon</span><span>Voorraad</span><span>Dashboard</span><span>Calculator</span><span>Website</span><span>Clicker</span><span>Quiz</span><span>Memory</span><span>Reactiespel</span></div>
<h3>Extra's</h3><div class="modules">
<label><input type="checkbox" name="database" value="true"> Database</label><label><input type="checkbox" name="excel" value="true"> Excel</label>
<label><input type="checkbox" name="photos" value="true"> Foto's</label><label><input type="checkbox" name="signature" value="true"> Handtekening</label>
<label><input type="checkbox" name="barcode" value="true"> Barcode</label><label><input type="checkbox" name="pwa" value="true" checked> PWA</label>
<label><input type="checkbox" name="email" value="true"> E-mail</label>
</div></div><button class="primary" type="submit">Slim bouwen</button></form></main></body></html>
