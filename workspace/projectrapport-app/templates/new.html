<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075985"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/static/manifest.json"><link rel="apple-touch-icon" href="/static/logo.svg"><title>Nieuw rapport</title><link rel="stylesheet" href="/static/app.css"></head><body><header><a class="back" href="/">‹</a><div><b>Nieuw projectrapport</b><small>Vul in • maak foto's • klaar</small></div><span></span></header><main><form method="post" enctype="multipart/form-data" id="form"><section><span class="step">1</span><h2>Projectgegevens</h2><label>Project / klus<input name="project" required placeholder="Bijv. Schilderwerk woning"></label><label>Adres<input name="address" required placeholder="Straat, huisnummer en plaats"></label><label>Klant <small>optioneel</small><input name="customer" placeholder="Naam klant"></label><label>Medewerker<input name="employee" required placeholder="Jouw naam"></label></section><section><span class="step">2</span><h2>Wat is er gedaan?</h2><textarea name="description" required rows="6" placeholder="Omschrijf werkzaamheden, schade, bevindingen of opleverpunten..."></textarea></section><section><span class="step">3</span><h2>Foto's</h2><p>Maak maximaal 10 foto's. Geef iedere foto eventueel een korte toelichting.</p><div class="upload"><input id="photos" name="photos" type="file" accept="image/*" capture="environment" multiple><span>📷</span><b>Foto maken of toevoegen</b><small id="count">0 van 10 foto's</small></div><div id="previews"></div></section><button class="save" type="submit">✓ Rapport opslaan</button></form></main><script>const inp=document.querySelector('#photos'),box=document.querySelector('#previews'),count=document.querySelector('#count');let files=[];inp.onchange=()=>{let room=10-files.length;files.push(...[...inp.files].slice(0,room));if(files.length>10)files=files.slice(0,10);render()};function render(){let dt=new DataTransfer();files.forEach(f=>dt.items.add(f));inp.files=dt.files;box.innerHTML='';files.forEach((f,i)=>{let d=document.createElement('div');d.className='photo';let im=document.createElement('img');im.src=URL.createObjectURL(f);let area=document.createElement('textarea');area.name='notes';area.rows=2;area.placeholder='Toelichting bij foto '+(i+1);let x=document.createElement('button');x.type='button';x.textContent='×';x.onclick=()=>{files.splice(i,1);render()};d.append(im,area,x);box.append(d)});count.textContent=files.length+' van 10 foto\'s';inp.disabled=files.length>=10}</script></body></html>
