<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><link rel="stylesheet" href="/static/app.css"><title>Inplannen</title></head><body><header><a class="back" href="/">‹</a><div><b>Klus inplannen</b><small>Nieuwe planning</small></div><span></span></header><main><form method="post"><section><div class="form-title"><span>📅</span><div><small>PLANNING</small><h2>Wie moet waarheen?</h2></div></div><label>Datum<input type="date" name="work_date" value="{{day}}" required></label><label>Medewerker<select name="employee_id" required><option value="">Kies medewerker</option>{% for e in employees %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select></label><label>Project / klus<input name="project" required placeholder="Bijv. Kozijnen schilderen"></label><label>Werkadres<input name="address" required placeholder="Straat, huisnummer, plaats"></label><div class="two"><label>Start<input type="time" name="start_time" value="07:30"></label><label>Klaar<input type="time" name="end_time" value="16:00"></label></div></section><section><div class="form-title"><span>👤</span><div><small>OP LOCATIE</small><h2>Extra informatie</h2></div></div><label>Contactpersoon <small>optioneel</small><input name="contact" placeholder="Naam klant/contact"></label><label>Telefoon <small>optioneel</small><input name="phone" type="tel" placeholder="06 12345678"></label><label>Opmerking voor medewerker<textarea name="notes" rows="4" placeholder="Bijv. eerst aanbellen achterzijde, materiaal meenemen..."></textarea></label></section><button class="save">✓ In planning zetten</button></form></main></body></html>
